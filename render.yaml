# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates a free Docker web service built from ./Dockerfile.
#
# After the first deploy, set RESEND_API_KEY (and RESEND_FROM) in the Render
# dashboard to enable real email delivery. Without them digests are recorded
# as "logged" — nothing is faked.
#
# Free services sleep after ~15 minutes without traffic and take ~50 seconds
# to wake on the next request.

services:
  - type: web
    name: agrivision
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CRON_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

  # Scheduled digests need a Render Cron Job. Cron jobs have no free plan, so
  # this is left uncommented only if you are happy with the `starter` plan.
  # Uncomment the block below (or create the cron job in the dashboard and
  # point it at `node scripts/cron-digest.mjs`) to run the digest at 06:00 and
  # 18:00 UTC.
  #
  # - type: cron
  #   name: agrivision-digest
  #   runtime: docker
  #   plan: starter
  #   region: frankfurt
  #   schedule: "0 6,18 * * *"
  #   dockerfilePath: ./Dockerfile
  #   dockerCommand: node scripts/cron-digest.mjs
  #   envVars:
  #     # Update if the web service gets a different URL.
  #     - key: APP_URL
  #       value: https://agrivision.onrender.com
  #     - key: CRON_SECRET
  #       fromService:
  #         type: web
  #         name: agrivision
  #         envVarKey: CRON_SECRET
